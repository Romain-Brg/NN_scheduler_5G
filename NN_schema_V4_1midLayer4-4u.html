<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réseau de neurones — 8 × 16 × 5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --bg2:       #f5f4f0;
    --text:      #1a1a1a;
    --text2:     #555;
    --border:    rgba(0,0,0,0.12);
    --border2:   rgba(0,0,0,0.22);
    --pos:       #185FA5;
    --neg:       #BA7517;
    --radius:    8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1a1a1a;
      --bg2:     #252525;
      --text:    #e8e6de;
      --text2:   #999;
      --border:  rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.22);
      --pos:     #85B7EB;
      --neg:     #F9CB42;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px 20px 40px;
    min-height: 100vh;
  }

  header {
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }
  header p {
    font-size: 12px;
    color: var(--text2);
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text2);
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #controls input[type=range] {
    width: 130px;
    accent-color: var(--pos);
  }

  #canvas-wrap {
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }
  canvas {
    display: block;
    width: 100%;
    cursor: default;
  }

  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text2);
  }
  #legend span { display: flex; align-items: center; gap: 5px; }
  .l-line { width: 22px; height: 3px; border-radius: 2px; }
  .l-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    transition: opacity 0.1s;
    z-index: 999;
    max-width: 220px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Réseau de neurones — 8 × 16 × 5</h1>
  <p>NN_1Layer_4_4U_real_v4.npz &nbsp;·&nbsp; 1 couche cachée &nbsp;·&nbsp; 8 entrées, 16 neurones cachés, 5 sorties</p>
</header>

<div id="controls">
  <label>
    Seuil de visibilité
    <input type="range" id="threshold" min="0" max="95" value="0" step="1">
    <span id="threshold-val">0 %</span>
  </label>
  <label><input type="checkbox" id="show-bias" checked> Biais</label>
  <label><input type="checkbox" id="show-labels" checked> Labels</label>
</div>

<div id="canvas-wrap">
  <canvas id="nn-canvas"></canvas>
</div>

<div id="legend">
  <span><span class="l-line" style="background:var(--pos)"></span> Poids positif</span>
  <span><span class="l-line" style="background:var(--neg)"></span> Poids négatif</span>
  <span><span class="l-dot" style="background:var(--pos)"></span> Biais &gt; 0</span>
  <span><span class="l-dot" style="background:var(--neg)"></span> Biais &lt; 0</span>
  <span><span class="l-dot" style="background:var(--text2);opacity:.5"></span> Biais ≈ 0</span>
</div>

<div id="tooltip"></div>

<script>
const NN = {"n_layers": 1, "sizes": [8, 16, 5], "weights": [[[-0.2935333265601701, 0.19691732181005173, 0.4839021365625107, 13.187429217020107, -0.30928748395941197, -0.6278192817399023, 0.4394437126719327, -0.37056742989622865], [-0.0564285828045607, -0.14636930560258082, 0.39194387472156894, -0.3327657974830254, -0.619401166725352, -0.6877753103254629, 0.7512703582521087, 11.456972834165715], [-0.09319454499175592, -0.186044195644143, -0.1748715309939453, -0.08827522822278458, 0.16306417930730435, -22.534661036559093, 0.20967679128864633, -20.50261655001127], [0.2720288514399784, 0.2848662796585584, -1.3556944283259402, 12.709114743469035, 0.7394066771174173, -0.05898306728222733, 0.6752454227419541, -0.03838054700709053], [0.5897013897433657, -28.773980096876652, -0.08355635891418414, -0.13783539495355293, -0.14040834450149736, -0.15683000301055702, -0.46025755902874377, -0.0527385232473096], [-0.08140844037297612, -0.09965373954812505, -0.05658554865698567, -0.019674607664689397, -0.11782782274590889, -0.14035762645091676, -0.010741119882747561, 0.010511223325866487], [0.32241543801050676, 0.12885816059532296, 0.5096447783222887, 0.2011559261927054, -0.8950494709874744, 12.865940186273729, 0.45482678195540316, 0.17930416367579288], [0.11526161144130276, -23.143793120725284, -0.11573900053213058, -0.09364090345741614, -0.19729404772490292, -0.2251508333227622, 0.3530907238043443, -15.308490274464521], [0.6784596713589096, -0.08045248834051977, 0.6623379298500631, -0.05994319630870792, 0.642271184619554, -0.11653395288497345, -1.5306033033875561, 11.096624682595182], [5.349446084460076, -0.09535206894824698, -0.8964602703268542, -0.2431290465745659, -4.0254810066256805, 2.2957221990356182, -0.3129226509417746, -0.21823907767023598], [0.18574937165552696, 0.24623306143283227, 0.7581905822403548, -0.013772932944503472, -1.3007839518105606, 12.579005238194213, 0.6827429467099188, -0.04777380316724986], [-0.1768147170123938, -0.2095796155225739, 0.2752655131208436, -19.014765063398986, -0.2933951466359806, -0.13519823060561878, 0.25953712396294204, -19.63424467959374], [0.040911757695868245, 0.029455608237358315, -0.12286003277628889, -0.04733273593403912, -0.08573514281876927, 0.01858925367702864, 0.037004613709129046, -0.051244908838436215], [-0.049871869851697004, -0.14601814482501194, 0.03385978564761427, -0.017132717944028354, -0.10227710444673352, -0.13757540541314456, 0.03584217280039797, 0.030052741509895037], [-3.6237814390835923, 0.22991830739430538, 0.017331670542485255, 0.22573104352933182, 3.6945268021449973, 0.13537907809062413, -0.13225820225555462, 0.03513293812342199], [-0.10508916695903328, -0.28527602066012864, 0.2744721789620273, -23.463969490842857, 0.16872649119212593, -19.20467890036652, -0.26854664068599404, -0.18820066918468945]], [[-1.3294975499198005, -2.0386765250852927, 4.9971559253281725, 2.3054642953453968, -15.3522814326469, 0.07886417461054848, -0.6139998748190513, -9.937679012111936, 2.48571077646474, 2.0990226435784662, 0.7538706166340172, 3.649214856749118, 0.09415726084013988, -0.11253715146964936, -1.742097383869918, 2.7345926374311573], [7.331416587995104, -1.3650618993624388, 7.096480606822889, -6.70027803274984, 2.9851782814284475, -0.10659195442975847, -1.8674633307083763, 3.988628777074422, 2.030066718010866, -0.5426970319222824, 2.947496432359906, -9.97749714059847, -0.060145031303240434, 0.05660098949487586, 0.1937576890088126, -10.119136399768989], [-2.0041757731993846, -1.6521177755919967, -10.886594503140202, 2.7825676410774616, 2.405046013385396, 0.0176903657789833, 7.356905776548409, 3.286574167117931, 1.8561044220975003, -1.1318368241055239, -6.880367432833755, 5.034034447394517, 0.1383377117001916, 0.05919331828522446, 1.7577922785253854, -8.851893461026828], [-1.8396347112226117, 6.30671786300276, -8.895282678217773, 2.960273749976558, 6.054631741963287, 0.03582474563553517, -1.684598999351889, -7.047185389282947, -6.149218208371548, -0.5802584520770002, 2.698950587513606, -8.043798764972074, 0.03595449934919857, 0.08200156059722, 0.20189535982420606, 6.971730124898695], [-1.817592840124308, -1.0968250073102341, 7.301509644801523, -1.064971041686469, 3.9637040448808225, -0.08681215703480516, -2.936874962453601, 9.730585821048159, -0.30002908533708933, -0.051840845964328336, 0.5602722419491086, 9.198556410986516, -0.13172282329643265, -0.16753616262138513, -0.46998128743683787, 9.34376616915022]]], "biases": [[0.5381731304556853, 0.5589926979887063, 0.26640549389909013, -0.3745117411192255, 0.3917688686661995, 0.0, 0.5219715536057017, 0.3214852623514148, -0.21278772010964864, 0.0858509130529797, -0.4137135548447841, 0.2966680246556408, -0.08031327631734057, -0.06691862637875688, 0.1471210994513164, 0.30533659087443304], [5.774843730115707, -1.2960847656174725, -1.5702002863650635, 0.48052150302374913, -3.3890801811392626]]};

const canvas  = document.getElementById('nn-canvas');
const ctx     = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const SIZES   = NN.sizes;        // [n_in, ...hidden..., n_out]
const N_LAYER = SIZES.length;    // nombre total de couches (entrée incluse)
const MAX_STR = 5;               // épaisseur max d'un trait en px

let hoveredNode = null;
let hoveredEdge = null;
let threshold   = 0;
let showBias    = true;
let showLabels  = true;
let edgeList    = [];

// ── Helpers ──────────────────────────────────────────────────────────────────

function isDark() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
  if (len2===0) return Math.hypot(px-x1, py-y1);
  const t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

// ── Layout ───────────────────────────────────────────────────────────────────

function getDims() {
  const maxN = Math.max(...SIZES);
  const w    = canvas.clientWidth || 900;
  const h    = Math.max(480, maxN * 28 + 100);
  return { w, h };
}

function setup() {
  const dpr = window.devicePixelRatio || 1;
  const { w, h } = getDims();
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  return { w, h };
}

function getPositions(w, h) {
  const margin = 0.08;
  return SIZES.map((n, li) => {
    const xFrac = N_LAYER === 1 ? 0.5 : margin + (li / (N_LAYER-1)) * (1 - 2*margin);
    const x     = w * xFrac;
    const spacing = h / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x, y: spacing*(i+1) }));
  });
}

// ── Max absolute weight per layer transition ──────────────────────────────────

function getMaxWeights() {
  return NN.weights.map(W =>
    Math.max(...W.map(row => Math.max(...row.map(Math.abs))))
  );
}

// ── Edge list ─────────────────────────────────────────────────────────────────

function buildEdges(pos, maxW, thresholds) {
  const edges = [];
  NN.weights.forEach((W, wi) => {
    const fromLayer = pos[wi];
    const toLayer   = pos[wi+1];
    const nFrom = fromLayer.length, nTo = toLayer.length;
    const thresh = thresholds[wi];
    for (let j = 0; j < nTo; j++) {
      for (let i = 0; i < nFrom; i++) {
        const w = W[j][i];
        if (Math.abs(w) < thresh) continue;
        edges.push({
          x1: fromLayer[i].x, y1: fromLayer[i].y,
          x2: toLayer[j].x,   y2: toLayer[j].y,
          w, maxW: maxW[wi],
          fromLayer: wi, fromIdx: i,
          toLayer: wi+1, toIdx: j,
          label: `${layerName(wi, i)} → ${layerName(wi+1, j)}`
        });
      }
    }
  });
  return edges;
}

function layerName(li, ni) {
  if (li === 0)          return `x${ni+1}`;
  if (li === N_LAYER-1)  return `y${ni+1}`;
  return `h${li}.${ni+1}`;
}

// ── Draw ──────────────────────────────────────────────────────────────────────

function draw() {
  const { w, h } = setup();
  const pos     = getPositions(w, h);
  const maxW    = getMaxWeights();
  const thresh  = maxW.map(m => (threshold/100)*m);
  edgeList = buildEdges(pos, maxW, thresh);

  ctx.clearRect(0, 0, w, h);

  const dark   = isDark();
  const posRGB = hexToRgb(dark ? '#85B7EB' : '#185FA5');
  const negRGB = hexToRgb(dark ? '#F9CB42' : '#BA7517');

  // Dessiner les arêtes
  edgeList.forEach((e, idx) => {
    const absW  = Math.abs(e.w);
    const norm  = absW / e.maxW;
    const [r,g,b] = e.w > 0 ? posRGB : negRGB;
    const isHovEdge = hoveredEdge === idx;

    let alpha, sw;
    if (hoveredEdge !== null) {
      alpha = isHovEdge ? Math.min(0.05 + norm*0.85, 1)*1.3 : (0.05+norm*0.85)*0.06;
      sw    = isHovEdge ? (0.3+norm*MAX_STR)*1.8 : 0.3+norm*MAX_STR;
    } else if (hoveredNode !== null) {
      const { li, ni } = hoveredNode;
      const conn = (li===e.fromLayer && ni===e.fromIdx) || (li===e.toLayer && ni===e.toIdx);
      alpha = conn ? Math.min(0.05+norm*0.85,1)*1.2 : (0.05+norm*0.85)*0.07;
      sw    = conn ? (0.3+norm*MAX_STR)*1.3 : 0.3+norm*MAX_STR;
    } else {
      alpha = 0.05 + norm*0.85;
      sw    = 0.3  + norm*MAX_STR;
    }

    ctx.beginPath();
    ctx.moveTo(e.x1, e.y1);
    ctx.lineTo(e.x2, e.y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth   = sw;
    ctx.stroke();
  });

  // Dessiner les neurones
  pos.forEach((layer, li) => {
    const R = Math.min(10, Math.max(4, (h/(layer.length+1))*0.27));
    layer.forEach((node, ni) => {
      const bias = li > 0 ? NN.biases[li-1][ni] : null;
      const isHov = hoveredNode && hoveredNode.li===li && hoveredNode.ni===ni;
      const fade  = (hoveredNode || hoveredEdge !== null) && !isHov;

      // Couleur du noeud selon biais
      let fill;
      if (bias === null) {
        fill = dark ? '#666' : '#bbb';
      } else if (Math.abs(bias) < 0.1) {
        fill = dark ? '#777' : '#aaa';
      } else {
        fill = bias > 0
          ? (dark ? '#85B7EB' : '#185FA5')
          : (dark ? '#F9CB42' : '#BA7517');
      }

      ctx.beginPath();
      ctx.arc(node.x, node.y, R+(isHov?3:0), 0, Math.PI*2);
      ctx.fillStyle   = fill;
      ctx.globalAlpha = fade ? 0.28 : 0.88;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';
      ctx.lineWidth   = isHov ? 2 : 0.5;
      ctx.stroke();

      // Biais textuel à l'intérieur si assez grand
      if (showBias && bias !== null && R >= 8) {
        ctx.font         = `${Math.max(8, R-1)}px system-ui,sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.85)';
        ctx.globalAlpha  = fade ? 0.22 : 0.75;
        ctx.fillText(bias.toFixed(2), node.x, node.y);
        ctx.globalAlpha  = 1;
      }

      // Label du neurone
      if (showLabels) {
        const label = layerName(li, ni);
        const lx    = li === 0 ? node.x - R - 5 : node.x + R + 5;
        ctx.font         = '11px system-ui,sans-serif';
        ctx.textAlign    = li === 0 ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(200,200,200,0.65)' : 'rgba(60,60,60,0.65)';
        ctx.globalAlpha  = fade ? 0.18 : 0.8;
        ctx.fillText(label, lx, node.y);
        ctx.globalAlpha  = 1;
      }
    });
  });

  // Labels de couche en bas
  const lnames = ['Entrées', ...Array.from({length:N_LAYER-2}, (_,i)=>`Cachée ${i+1}`), 'Sorties'];
  const lsizes = SIZES;
  ctx.font      = '11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = dark ? 'rgba(170,170,170,0.65)' : 'rgba(90,90,90,0.65)';
  ctx.globalAlpha = 1;
  const ly = h - 8;
  pos.forEach((layer, li) => {
    ctx.fillText(`${lnames[li]} (${lsizes[li]})`, layer[Math.floor(layer.length/2)].x, ly);
  });
}

// ── Hit tests ─────────────────────────────────────────────────────────────────

function hitNode(mx, my) {
  const { w, h } = getDims();
  const pos = getPositions(w, h);
  const R = 14;
  for (let li=0; li<pos.length; li++)
    for (let ni=0; ni<pos[li].length; ni++) {
      const n = pos[li][ni];
      if ((mx-n.x)**2 + (my-n.y)**2 <= R*R) return { li, ni };
    }
  return null;
}

function hitEdge(mx, my) {
  for (let i=edgeList.length-1; i>=0; i--) {
    const e = edgeList[i];
    const sw  = 0.3 + (Math.abs(e.w)/e.maxW)*MAX_STR;
    const hit = Math.max(5, sw*0.5+2);
    if (distToSegment(mx, my, e.x1, e.y1, e.x2, e.y2) <= hit) return i;
  }
  return null;
}

// ── Tooltip ───────────────────────────────────────────────────────────────────

function showTip(ev, html) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = '1';
  tooltip.style.left = (ev.clientX+14)+'px';
  tooltip.style.top  = (ev.clientY-10)+'px';
}

function hideTip() {
  tooltip.style.opacity = '0';
}

canvas.addEventListener('mousemove', ev => {
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const nh = hitNode(mx, my);

  if (nh) {
    hoveredNode = nh; hoveredEdge = null;
    canvas.style.cursor = 'pointer';
    const { li, ni } = nh;
    const name  = layerName(li, ni);
    const lname = li===0 ? 'Entrée' : li===N_LAYER-1 ? 'Sortie' : `Cachée ${li}`;
    let html = `<strong>${lname} — ${name}</strong><br>`;
    if (li > 0) {
      const b = NN.biases[li-1][ni];
      html += `Biais : ${b > 0 ? '+' : ''}${b.toFixed(5)}<br>`;
    }
    // Top 3 poids entrants (sauf couche d'entrée)
    if (li > 0) {
      const W = NN.weights[li-1];
      const top = W[ni].map((v,i) => ({v,i})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 entrants :<br>`;
      top.forEach(({v,i}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;${layerName(li-1,i)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    // Top 3 poids sortants (sauf couche de sortie)
    if (li < N_LAYER-1) {
      const W = NN.weights[li];
      const top = W.map((row,j) => ({v:row[ni],j})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 sortants :<br>`;
      top.forEach(({v,j}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;→ ${layerName(li+1,j)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    showTip(ev, html);
  } else {
    const eh = hitEdge(mx, my);
    if (eh !== null) {
      hoveredEdge = eh; hoveredNode = null;
      canvas.style.cursor = 'crosshair';
      const e = edgeList[eh];
      const c = e.w > 0 ? 'var(--pos)' : 'var(--neg)';
      showTip(ev,
        `<strong>${e.label}</strong><br>` +
        `Poids : <span style="color:${c};font-weight:500">${e.w>0?'+':''}${e.w.toFixed(6)}</span>`
      );
    } else {
      hoveredNode = null; hoveredEdge = null;
      canvas.style.cursor = 'default';
      hideTip();
    }
  }
  draw();
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null; hoveredEdge = null;
  hideTip(); draw();
});

// ── Contrôles ─────────────────────────────────────────────────────────────────

document.getElementById('threshold').addEventListener('input', function() {
  threshold = +this.value;
  document.getElementById('threshold-val').textContent = threshold + ' %';
  draw();
});
document.getElementById('show-bias').addEventListener('change',   function() { showBias   = this.checked; draw(); });
document.getElementById('show-labels').addEventListener('change', function() { showLabels = this.checked; draw(); });

window.addEventListener('resize', draw);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

draw();
</script>
</body>
</html>
