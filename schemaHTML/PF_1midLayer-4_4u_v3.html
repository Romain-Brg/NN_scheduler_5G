<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réseau de neurones — 8 × 16 × 5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --bg2:       #f5f4f0;
    --text:      #1a1a1a;
    --text2:     #555;
    --border:    rgba(0,0,0,0.12);
    --border2:   rgba(0,0,0,0.22);
    --pos:       #185FA5;
    --neg:       #BA7517;
    --radius:    8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1a1a1a;
      --bg2:     #252525;
      --text:    #e8e6de;
      --text2:   #999;
      --border:  rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.22);
      --pos:     #85B7EB;
      --neg:     #F9CB42;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px 20px 40px;
    min-height: 100vh;
  }

  header {
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }
  header p {
    font-size: 12px;
    color: var(--text2);
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text2);
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #controls input[type=range] {
    width: 130px;
    accent-color: var(--pos);
  }

  #canvas-wrap {
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }
  canvas {
    display: block;
    width: 100%;
    cursor: default;
  }

  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text2);
  }
  #legend span { display: flex; align-items: center; gap: 5px; }
  .l-line { width: 22px; height: 3px; border-radius: 2px; }
  .l-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    transition: opacity 0.1s;
    z-index: 999;
    max-width: 220px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Réseau de neurones — 8 × 16 × 5</h1>
  <p>NN_PF_1Layer_4_4U_real_V3.npz &nbsp;·&nbsp; 1 couche cachée &nbsp;·&nbsp; 8 entrées, 16 neurones cachés, 5 sorties</p>
</header>

<div id="controls">
  <label>
    Seuil de visibilité
    <input type="range" id="threshold" min="0" max="95" value="0" step="1">
    <span id="threshold-val">0 %</span>
  </label>
  <label><input type="checkbox" id="show-bias" checked> Biais</label>
  <label><input type="checkbox" id="show-labels" checked> Labels</label>
</div>

<div id="canvas-wrap">
  <canvas id="nn-canvas"></canvas>
</div>

<div id="legend">
  <span><span class="l-line" style="background:var(--pos)"></span> Poids positif</span>
  <span><span class="l-line" style="background:var(--neg)"></span> Poids négatif</span>
  <span><span class="l-dot" style="background:var(--pos)"></span> Biais &gt; 0</span>
  <span><span class="l-dot" style="background:var(--neg)"></span> Biais &lt; 0</span>
  <span><span class="l-dot" style="background:var(--text2);opacity:.5"></span> Biais ≈ 0</span>
</div>

<div id="tooltip"></div>

<script>
const NN = {"n_layers": 1, "sizes": [8, 16, 5], "weights": [[[-3.136657857822862, 0.013347903110256997, -0.08737184032353362, 0.011829041118971305, 4.960230182936256, 0.04805995130103314, 0.004272115952141974, 0.026509812636191475], [-0.15985044563292702, -0.17842368124474373, 0.658314036738435, -35.632673913860444, -0.49756446776814806, -0.07908824766163988, -0.4551654424487753, -0.24365729642286452], [0.35759883167842493, 0.19934946896810554, 0.48604153208638085, 0.17713748573216842, -2.4997131723676063, 15.24989015796622, 1.6083471250769812, 0.18493609905855804], [4.4145501632032635, 0.0762019958095577, -0.34797527345322343, 0.19978086185430574, -4.871237581443401, 7.181628713589863, -1.544117136974737, 0.26446162063114126], [0.4302938667692476, -34.547768469429954, -0.07219262692764902, -0.09922466151804392, -0.3453794701270127, -0.01980296101055602, -0.28887980083499826, -0.17135198780085573], [0.21884463429903553, 0.6228616029740566, 0.436746439959122, 1.24066944781368, -0.6555663518859576, 3.895667052930973, -1.0035353785526366, -0.4584574618776673], [0.09748189266494794, -9.308553047448987, 0.08622248278729548, -9.817569328865359, 0.11943224498757864, -26.748462380579422, -0.19800147946803784, -0.3086276698456785], [-0.15311592275972372, -0.09786356404250462, -0.1547961410571127, -0.10454705641241972, -0.26024649720328635, -0.009171932877765028, 0.5508564009840087, -38.49918769490357], [-0.08128108718284897, 0.1466715498580198, -3.9026891270154414, 0.23107818175409342, -0.09461318351686626, 0.19943779957930297, 5.481754241196361, -0.28423543866884216], [2.7634499242592963, -4.606603493399587, -0.7197786849564523, -0.36389536858641003, -1.3571362637730906, -0.38083909722331327, -2.43952872629392, 0.11364883390816385], [0.9152733727811317, -4.146376167491643, 0.5384823969937271, -1.2714735926367882, -3.8228687416302836, 0.16244600499757356, 2.5678840042800513, -4.004110116464035], [0.24252171412777915, 0.27493198269494845, 0.09696341521161367, 0.31315138803794035, -0.6512969624254411, 15.684386134703896, 0.2317441451522876, 1.0757383097767912], [-0.6818107107697052, 0.06313702284979265, 6.480806232291457, -0.0462058934409991, -3.0897344067908716, 1.5578270651502941, -5.293156983747738, 0.6311636936367798], [-0.2572142635520605, 0.9029230151687955, 0.500728584259561, 1.7689504707178707, -0.5315629031647634, -2.2931741778612604, 0.05082758108751937, 4.13620881018863], [-0.060244469649054944, 0.04102946247651209, -0.15520063087301159, -0.04471040137603105, -0.03690791435954167, -0.1665756018811574, -0.012325186092165314, 0.018904599030439267], [1.8207630629705642, 0.3333144625002416, -0.5376389834298281, 0.47787627227434354, 3.232600807353968, -0.06326635327228233, -3.8097704682794005, 2.1179895367959687]], [[-1.3906985747765952, 4.703449341594903, 0.3534870685901408, 4.040152029358969, -18.336946206928342, 0.37275241768989015, -2.40161281436299, 3.5719720624485305, 0.0964323401226439, -3.8286182051311304, -2.3735604878281436, -0.27060512999884767, -0.6590659600864677, 0.04542605592956448, -0.10388446815165507, 2.00169699157667], [0.27073386729003945, -19.03548464416121, 2.350118828209087, -0.9514206625450863, 4.490821351207003, 0.6281825431723541, -3.286419909913381, 3.8782282550103035, -1.702915258464998, 0.5937943226145611, -0.8616634813571001, -0.1586231884452441, 2.747333199459692, 1.080472673202175, 0.17706281867637938, -0.6457643162714048], [1.3166224838169436, 4.614385143942544, -7.069236960767521, -1.414379957114032, 4.2480158472007234, 1.9113280223578075, -10.76880561694226, 2.720428845676868, 0.006720082970825948, 0.12063807044958556, 3.431444632471139, 8.895205119791964, -0.5354963344437544, -0.9606572882459162, 0.004892958903875641, 0.835701966131833], [-0.04405138192403648, 4.488334899412595, 6.415611200936534, -1.1690705461962643, 4.404350086806179, -1.6280610162939413, 3.785059340813758, -18.964211595853115, 1.6929979253958591, 2.2664669423618014, -2.113803582784857, -2.9322704004006717, -1.0306878623105011, 2.6385655134449673, -0.07277731140881401, -1.7694163152638682], [0.033354405007176666, 5.462457913008018, -2.037214545591594, -0.5903190044589001, 5.1388649053808395, -1.1367612517791226, 12.658469292927157, 9.221849160276163, 0.024176699936809678, 0.9752400595261044, 1.8248275546847026, -5.406143080255309, -0.1196976266328162, -2.9631956705557507, -0.03304398838620161, -0.4697538361692603]]], "biases": [[0.1157230605369827, 0.5306481312398021, -0.4507556335200346, -0.15826763620608125, 0.44574281620147216, 0.38155720047580277, 0.283792353979357, 0.4805107565766112, 0.546755009845207, -0.34928124810123584, -0.6331108752502537, 0.2769165913707223, -0.2828116010900022, 1.2859600234487503, -0.014689145537737472, 0.37945681776628676], [1.5125644541496674, 2.4029412902513547, -3.942586407900364, 1.6130100961156406, -1.5859294326078819]]};

const canvas  = document.getElementById('nn-canvas');
const ctx     = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const SIZES   = NN.sizes;        // [n_in, ...hidden..., n_out]
const N_LAYER = SIZES.length;    // nombre total de couches (entrée incluse)
const MAX_STR = 5;               // épaisseur max d'un trait en px

let hoveredNode = null;
let hoveredEdge = null;
let threshold   = 0;
let showBias    = true;
let showLabels  = true;
let edgeList    = [];

// ── Helpers ──────────────────────────────────────────────────────────────────

function isDark() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
  if (len2===0) return Math.hypot(px-x1, py-y1);
  const t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

// ── Layout ───────────────────────────────────────────────────────────────────

function getDims() {
  const maxN = Math.max(...SIZES);
  const w    = canvas.clientWidth || 900;
  const h    = Math.max(480, maxN * 28 + 100);
  return { w, h };
}

function setup() {
  const dpr = window.devicePixelRatio || 1;
  const { w, h } = getDims();
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  return { w, h };
}

function getPositions(w, h) {
  const margin = 0.08;
  return SIZES.map((n, li) => {
    const xFrac = N_LAYER === 1 ? 0.5 : margin + (li / (N_LAYER-1)) * (1 - 2*margin);
    const x     = w * xFrac;
    const spacing = h / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x, y: spacing*(i+1) }));
  });
}

// ── Max absolute weight per layer transition ──────────────────────────────────

function getMaxWeights() {
  return NN.weights.map(W =>
    Math.max(...W.map(row => Math.max(...row.map(Math.abs))))
  );
}

// ── Edge list ─────────────────────────────────────────────────────────────────

function buildEdges(pos, maxW, thresholds) {
  const edges = [];
  NN.weights.forEach((W, wi) => {
    const fromLayer = pos[wi];
    const toLayer   = pos[wi+1];
    const nFrom = fromLayer.length, nTo = toLayer.length;
    const thresh = thresholds[wi];
    for (let j = 0; j < nTo; j++) {
      for (let i = 0; i < nFrom; i++) {
        const w = W[j][i];
        if (Math.abs(w) < thresh) continue;
        edges.push({
          x1: fromLayer[i].x, y1: fromLayer[i].y,
          x2: toLayer[j].x,   y2: toLayer[j].y,
          w, maxW: maxW[wi],
          fromLayer: wi, fromIdx: i,
          toLayer: wi+1, toIdx: j,
          label: `${layerName(wi, i)} → ${layerName(wi+1, j)}`
        });
      }
    }
  });
  return edges;
}

function layerName(li, ni) {
  if (li === 0)          return `x${ni+1}`;
  if (li === N_LAYER-1)  return `y${ni+1}`;
  return `h${li}.${ni+1}`;
}

// ── Draw ──────────────────────────────────────────────────────────────────────

function draw() {
  const { w, h } = setup();
  const pos     = getPositions(w, h);
  const maxW    = getMaxWeights();
  const thresh  = maxW.map(m => (threshold/100)*m);
  edgeList = buildEdges(pos, maxW, thresh);

  ctx.clearRect(0, 0, w, h);

  const dark   = isDark();
  const posRGB = hexToRgb(dark ? '#85B7EB' : '#185FA5');
  const negRGB = hexToRgb(dark ? '#F9CB42' : '#BA7517');

  // Dessiner les arêtes
  edgeList.forEach((e, idx) => {
    const absW  = Math.abs(e.w);
    const norm  = absW / e.maxW;
    const [r,g,b] = e.w > 0 ? posRGB : negRGB;
    const isHovEdge = hoveredEdge === idx;

    let alpha, sw;
    if (hoveredEdge !== null) {
      alpha = isHovEdge ? Math.min(0.05 + norm*0.85, 1)*1.3 : (0.05+norm*0.85)*0.06;
      sw    = isHovEdge ? (0.3+norm*MAX_STR)*1.8 : 0.3+norm*MAX_STR;
    } else if (hoveredNode !== null) {
      const { li, ni } = hoveredNode;
      const conn = (li===e.fromLayer && ni===e.fromIdx) || (li===e.toLayer && ni===e.toIdx);
      alpha = conn ? Math.min(0.05+norm*0.85,1)*1.2 : (0.05+norm*0.85)*0.07;
      sw    = conn ? (0.3+norm*MAX_STR)*1.3 : 0.3+norm*MAX_STR;
    } else {
      alpha = 0.05 + norm*0.85;
      sw    = 0.3  + norm*MAX_STR;
    }

    ctx.beginPath();
    ctx.moveTo(e.x1, e.y1);
    ctx.lineTo(e.x2, e.y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth   = sw;
    ctx.stroke();
  });

  // Dessiner les neurones
  pos.forEach((layer, li) => {
    const R = Math.min(10, Math.max(4, (h/(layer.length+1))*0.27));
    layer.forEach((node, ni) => {
      const bias = li > 0 ? NN.biases[li-1][ni] : null;
      const isHov = hoveredNode && hoveredNode.li===li && hoveredNode.ni===ni;
      const fade  = (hoveredNode || hoveredEdge !== null) && !isHov;

      // Couleur du noeud selon biais
      let fill;
      if (bias === null) {
        fill = dark ? '#666' : '#bbb';
      } else if (Math.abs(bias) < 0.1) {
        fill = dark ? '#777' : '#aaa';
      } else {
        fill = bias > 0
          ? (dark ? '#85B7EB' : '#185FA5')
          : (dark ? '#F9CB42' : '#BA7517');
      }

      ctx.beginPath();
      ctx.arc(node.x, node.y, R+(isHov?3:0), 0, Math.PI*2);
      ctx.fillStyle   = fill;
      ctx.globalAlpha = fade ? 0.28 : 0.88;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';
      ctx.lineWidth   = isHov ? 2 : 0.5;
      ctx.stroke();

      // Biais textuel à l'intérieur si assez grand
      if (showBias && bias !== null && R >= 8) {
        ctx.font         = `${Math.max(8, R-1)}px system-ui,sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.85)';
        ctx.globalAlpha  = fade ? 0.22 : 0.75;
        ctx.fillText(bias.toFixed(2), node.x, node.y);
        ctx.globalAlpha  = 1;
      }

      // Label du neurone
      if (showLabels) {
        const label = layerName(li, ni);
        const lx    = li === 0 ? node.x - R - 5 : node.x + R + 5;
        ctx.font         = '11px system-ui,sans-serif';
        ctx.textAlign    = li === 0 ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(200,200,200,0.65)' : 'rgba(60,60,60,0.65)';
        ctx.globalAlpha  = fade ? 0.18 : 0.8;
        ctx.fillText(label, lx, node.y);
        ctx.globalAlpha  = 1;
      }
    });
  });

  // Labels de couche en bas
  const lnames = ['Entrées', ...Array.from({length:N_LAYER-2}, (_,i)=>`Cachée ${i+1}`), 'Sorties'];
  const lsizes = SIZES;
  ctx.font      = '11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = dark ? 'rgba(170,170,170,0.65)' : 'rgba(90,90,90,0.65)';
  ctx.globalAlpha = 1;
  const ly = h - 8;
  pos.forEach((layer, li) => {
    ctx.fillText(`${lnames[li]} (${lsizes[li]})`, layer[Math.floor(layer.length/2)].x, ly);
  });
}

// ── Hit tests ─────────────────────────────────────────────────────────────────

function hitNode(mx, my) {
  const { w, h } = getDims();
  const pos = getPositions(w, h);
  const R = 14;
  for (let li=0; li<pos.length; li++)
    for (let ni=0; ni<pos[li].length; ni++) {
      const n = pos[li][ni];
      if ((mx-n.x)**2 + (my-n.y)**2 <= R*R) return { li, ni };
    }
  return null;
}

function hitEdge(mx, my) {
  for (let i=edgeList.length-1; i>=0; i--) {
    const e = edgeList[i];
    const sw  = 0.3 + (Math.abs(e.w)/e.maxW)*MAX_STR;
    const hit = Math.max(5, sw*0.5+2);
    if (distToSegment(mx, my, e.x1, e.y1, e.x2, e.y2) <= hit) return i;
  }
  return null;
}

// ── Tooltip ───────────────────────────────────────────────────────────────────

function showTip(ev, html) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = '1';
  tooltip.style.left = (ev.clientX+14)+'px';
  tooltip.style.top  = (ev.clientY-10)+'px';
}

function hideTip() {
  tooltip.style.opacity = '0';
}

canvas.addEventListener('mousemove', ev => {
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const nh = hitNode(mx, my);

  if (nh) {
    hoveredNode = nh; hoveredEdge = null;
    canvas.style.cursor = 'pointer';
    const { li, ni } = nh;
    const name  = layerName(li, ni);
    const lname = li===0 ? 'Entrée' : li===N_LAYER-1 ? 'Sortie' : `Cachée ${li}`;
    let html = `<strong>${lname} — ${name}</strong><br>`;
    if (li > 0) {
      const b = NN.biases[li-1][ni];
      html += `Biais : ${b > 0 ? '+' : ''}${b.toFixed(5)}<br>`;
    }
    // Top 3 poids entrants (sauf couche d'entrée)
    if (li > 0) {
      const W = NN.weights[li-1];
      const top = W[ni].map((v,i) => ({v,i})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 entrants :<br>`;
      top.forEach(({v,i}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;${layerName(li-1,i)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    // Top 3 poids sortants (sauf couche de sortie)
    if (li < N_LAYER-1) {
      const W = NN.weights[li];
      const top = W.map((row,j) => ({v:row[ni],j})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 sortants :<br>`;
      top.forEach(({v,j}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;→ ${layerName(li+1,j)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    showTip(ev, html);
  } else {
    const eh = hitEdge(mx, my);
    if (eh !== null) {
      hoveredEdge = eh; hoveredNode = null;
      canvas.style.cursor = 'crosshair';
      const e = edgeList[eh];
      const c = e.w > 0 ? 'var(--pos)' : 'var(--neg)';
      showTip(ev,
        `<strong>${e.label}</strong><br>` +
        `Poids : <span style="color:${c};font-weight:500">${e.w>0?'+':''}${e.w.toFixed(6)}</span>`
      );
    } else {
      hoveredNode = null; hoveredEdge = null;
      canvas.style.cursor = 'default';
      hideTip();
    }
  }
  draw();
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null; hoveredEdge = null;
  hideTip(); draw();
});

// ── Contrôles ─────────────────────────────────────────────────────────────────

document.getElementById('threshold').addEventListener('input', function() {
  threshold = +this.value;
  document.getElementById('threshold-val').textContent = threshold + ' %';
  draw();
});
document.getElementById('show-bias').addEventListener('change',   function() { showBias   = this.checked; draw(); });
document.getElementById('show-labels').addEventListener('change', function() { showLabels = this.checked; draw(); });

window.addEventListener('resize', draw);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

draw();
</script>
</body>
</html>
