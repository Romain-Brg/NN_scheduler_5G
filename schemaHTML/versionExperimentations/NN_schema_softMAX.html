<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réseau de neurones — 8 × 16 × 5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --bg2:       #f5f4f0;
    --text:      #1a1a1a;
    --text2:     #555;
    --border:    rgba(0,0,0,0.12);
    --border2:   rgba(0,0,0,0.22);
    --pos:       #185FA5;
    --neg:       #BA7517;
    --radius:    8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1a1a1a;
      --bg2:     #252525;
      --text:    #e8e6de;
      --text2:   #999;
      --border:  rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.22);
      --pos:     #85B7EB;
      --neg:     #F9CB42;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px 20px 40px;
    min-height: 100vh;
  }

  header {
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }
  header p {
    font-size: 12px;
    color: var(--text2);
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text2);
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #controls input[type=range] {
    width: 130px;
    accent-color: var(--pos);
  }

  #canvas-wrap {
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }
  canvas {
    display: block;
    width: 100%;
    cursor: default;
  }

  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text2);
  }
  #legend span { display: flex; align-items: center; gap: 5px; }
  .l-line { width: 22px; height: 3px; border-radius: 2px; }
  .l-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    transition: opacity 0.1s;
    z-index: 999;
    max-width: 220px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Réseau de neurones — 8 × 16 × 5</h1>
  <p>NN_1mid4_softMaxe.npz &nbsp;·&nbsp; 1 couche cachée &nbsp;·&nbsp; 8 entrées, 16 neurones cachés, 5 sorties</p>
</header>

<div id="controls">
  <label>
    Seuil de visibilité
    <input type="range" id="threshold" min="0" max="95" value="0" step="1">
    <span id="threshold-val">0 %</span>
  </label>
  <label><input type="checkbox" id="show-bias" checked> Biais</label>
  <label><input type="checkbox" id="show-labels" checked> Labels</label>
</div>

<div id="canvas-wrap">
  <canvas id="nn-canvas"></canvas>
</div>

<div id="legend">
  <span><span class="l-line" style="background:var(--pos)"></span> Poids positif</span>
  <span><span class="l-line" style="background:var(--neg)"></span> Poids négatif</span>
  <span><span class="l-dot" style="background:var(--pos)"></span> Biais &gt; 0</span>
  <span><span class="l-dot" style="background:var(--neg)"></span> Biais &lt; 0</span>
  <span><span class="l-dot" style="background:var(--text2);opacity:.5"></span> Biais ≈ 0</span>
</div>

<div id="tooltip"></div>

<script>
const NN = {"n_layers": 1, "sizes": [8, 16, 5], "weights": [[[0.05129225347068088, 0.0001559862005393999, -0.004791834682583631, 0.00039712702689722863, -0.005000244981796227, 0.0010074675797227836, -0.018485088862419955, 0.033003233511887775], [-0.004383129085146839, 0.0027366921869019325, 0.06143357981650784, 1.3799407521199211e-05, -0.012002774776723736, -1.6149928835446806e-05, -0.018402994239414612, 0.019463419374350706], [0.0012039329606899044, 0.0029132139773861317, 0.0026501920906848993, 0.006055630632104362, 0.004114224633456901, 0.0032672133368034074, -0.005270036825212901, 0.16833686593248434], [-0.0009025416997779039, 0.0008060734549717817, -0.00017709532437051956, -7.19872516153479e-05, -0.0008878112465187717, 9.826987848739763e-05, -0.000276633574080888, -0.0011181217191276321], [0.002507229398737265, 0.001959128433777619, 0.004369723502751602, 0.001632264627282425, 0.004075601519876264, 0.0016830105364515015, -0.004949266334908786, 0.1538809506123043], [-0.000239964389466216, 0.07664966162418373, -0.0001786893910925942, 0.009254540434118632, 0.0011686089914333217, 0.0035413240226330692, 0.0035910215305372463, 0.00902572264214604], [-0.00104889077927812, -0.0008803454292412682, -0.0013285018196838544, -0.0008263525579803241, 0.0063087168753279705, -0.18251492558640955, -0.0021436275606614838, -0.0003545786493597202], [-0.005047174967653132, 0.008859246516701653, -0.0005268381474887149, 0.02260093293020936, -0.0008575231387693893, 0.01676941899782454, -0.0013783296685929188, -0.010666669689727204], [-0.00016816361854128125, -0.0004580984515082701, -0.00019771242880297005, -0.0004136196375952343, 0.00018459375367454688, -0.0011444871333207846, -9.346874404550284e-05, -0.0005048328082086182], [-0.017462505844059693, 0.04677216486557849, 0.007634739187758418, 0.00623863144482956, 0.012168346634415217, 0.004754819514858004, 0.017066020988382873, 0.003820123274675348], [-0.0023869852410526187, 0.0022957472479217043, -0.0007849354290805014, 0.0012927490864811067, 0.046967679899693124, -0.0007816117130708644, -0.023804826865428553, 0.027900144867071035], [-4.642757031454326e-05, 0.006716450670187993, -0.020617973161653678, 0.0011058234232928419, 0.03166276929796339, 0.0028343674574870226, 0.006505640059599397, 0.01225514088984143], [-0.0017687964091160947, -0.003653399982523731, 0.001357093201286843, -0.06071192306281907, 0.0008127239967057773, -0.07058076442954217, 0.001555854432869662, -0.11982255917354241], [-0.00292074824397253, 0.008345489168797291, -0.005726721753413743, 0.005090965760511569, -0.013863273424271447, 0.00769960316401409, 0.038798307804163386, 0.001259218210051229], [0.004440705624163137, -0.17444681322572936, -0.0008422054308191786, -0.0008594969064888135, -0.0006013317308967787, -0.0009458553216836411, -0.0015688630182056284, -0.0004132506041314041], [-0.0011270775472392797, -0.0009277380439583694, 0.005637807405350181, -0.18155303868368866, -0.0008575719677680414, -0.0010190884662722175, -0.002001750113622521, -0.00019396150567417856]], [[0.020492852408946237, -0.0054605484618378665, -0.010900658894662203, 0.001305591436178267, 0.02393519549769456, 0.025555746069283986, 0.03459629647405673, 0.010619401085584006, -0.0009678186033067277, -0.022070393895882383, -0.006060674323476414, -0.00042619014616894594, 0.0035515779612272547, -0.0024494049351904885, -0.16263078045830048, 0.036401876473898725], [-0.006742248138865325, 0.021841643884690266, -0.014736253785079723, -0.0006764330477124962, 0.031244111800051905, 0.008548415448130455, 0.04110078593622722, 0.012163802176985554, -0.00046403831649460895, 0.006656210715933, -0.0011269220792914402, -0.015440349181277827, -0.022913587876243147, -0.008140632833820194, 0.032916934298629776, -0.16561147484389935], [-0.007258880214371427, -0.007106405680556885, -0.017045693030618075, -0.0004684188613300785, 0.030569812799244072, 0.004984787476324342, -0.16396086572818752, 0.011674917163210091, -7.969819450557599e-05, 0.010190879944882443, 0.02458243266192434, 0.012312404897764114, -0.03311223749566285, -0.013077412006622912, 0.034433392139834255, 0.03667776175036741], [-0.008261490123643661, -0.006362599530122338, 0.08321869184007107, 0.001332216824136575, -0.07559017743047554, 0.0052235790775687005, 0.03348750409237304, -0.012490709360622571, -0.0004927871467415062, 0.010143983405527293, -0.012140682349377192, 0.0008604678109906907, -0.0684762714753618, 0.02049254112482019, 0.02669995896275766, 0.03647581398625219], [0.0021106306859915366, -0.0018851461404490223, -0.04078797635928329, -0.0006744797911584208, -0.0095865326769223, -0.0462051017794341, 0.052831796161428024, -0.0205512482554688, -0.0012126554074559114, -0.004751680401379447, -0.001602440738739073, 0.002707933351025511, 0.12264776310565517, 0.004231586748537818, 0.0672523753540945, 0.053926326967701145]]], "biases": [[-0.09024862552517675, 0.16330752994547257, 0.6647913745701546, -0.035320876815208145, -0.5747900268855932, -0.0009138045361987543, 0.5331313665043348, 2.199075705248764, -0.015585083201462445, 0.16790663125904393, 0.2993295595000345, 0.3527345942434183, 0.45179655635355614, 0.13479384272178735, 0.49649587738718953, 0.5222464216425426], [3.2061519285434357, 2.6222484326665567, 1.484408533221368, -5.069717579545812, -2.243091314868695]]};

const canvas  = document.getElementById('nn-canvas');
const ctx     = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const SIZES   = NN.sizes;        // [n_in, ...hidden..., n_out]
const N_LAYER = SIZES.length;    // nombre total de couches (entrée incluse)
const MAX_STR = 5;               // épaisseur max d'un trait en px

let hoveredNode = null;
let hoveredEdge = null;
let threshold   = 0;
let showBias    = true;
let showLabels  = true;
let edgeList    = [];

// ── Helpers ──────────────────────────────────────────────────────────────────

function isDark() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
  if (len2===0) return Math.hypot(px-x1, py-y1);
  const t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

// ── Layout ───────────────────────────────────────────────────────────────────

function getDims() {
  const maxN = Math.max(...SIZES);
  const w    = canvas.clientWidth || 900;
  const h    = Math.max(480, maxN * 28 + 100);
  return { w, h };
}

function setup() {
  const dpr = window.devicePixelRatio || 1;
  const { w, h } = getDims();
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  return { w, h };
}

function getPositions(w, h) {
  const margin = 0.08;
  return SIZES.map((n, li) => {
    const xFrac = N_LAYER === 1 ? 0.5 : margin + (li / (N_LAYER-1)) * (1 - 2*margin);
    const x     = w * xFrac;
    const spacing = h / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x, y: spacing*(i+1) }));
  });
}

// ── Max absolute weight per layer transition ──────────────────────────────────

function getMaxWeights() {
  return NN.weights.map(W =>
    Math.max(...W.map(row => Math.max(...row.map(Math.abs))))
  );
}

// ── Edge list ─────────────────────────────────────────────────────────────────

function buildEdges(pos, maxW, thresholds) {
  const edges = [];
  NN.weights.forEach((W, wi) => {
    const fromLayer = pos[wi];
    const toLayer   = pos[wi+1];
    const nFrom = fromLayer.length, nTo = toLayer.length;
    const thresh = thresholds[wi];
    for (let j = 0; j < nTo; j++) {
      for (let i = 0; i < nFrom; i++) {
        const w = W[j][i];
        if (Math.abs(w) < thresh) continue;
        edges.push({
          x1: fromLayer[i].x, y1: fromLayer[i].y,
          x2: toLayer[j].x,   y2: toLayer[j].y,
          w, maxW: maxW[wi],
          fromLayer: wi, fromIdx: i,
          toLayer: wi+1, toIdx: j,
          label: `${layerName(wi, i)} → ${layerName(wi+1, j)}`
        });
      }
    }
  });
  return edges;
}

function layerName(li, ni) {
  if (li === 0)          return `x${ni+1}`;
  if (li === N_LAYER-1)  return `y${ni+1}`;
  return `h${li}.${ni+1}`;
}

// ── Draw ──────────────────────────────────────────────────────────────────────

function draw() {
  const { w, h } = setup();
  const pos     = getPositions(w, h);
  const maxW    = getMaxWeights();
  const thresh  = maxW.map(m => (threshold/100)*m);
  edgeList = buildEdges(pos, maxW, thresh);

  ctx.clearRect(0, 0, w, h);

  const dark   = isDark();
  const posRGB = hexToRgb(dark ? '#85B7EB' : '#185FA5');
  const negRGB = hexToRgb(dark ? '#F9CB42' : '#BA7517');

  // Dessiner les arêtes
  edgeList.forEach((e, idx) => {
    const absW  = Math.abs(e.w);
    const norm  = absW / e.maxW;
    const [r,g,b] = e.w > 0 ? posRGB : negRGB;
    const isHovEdge = hoveredEdge === idx;

    let alpha, sw;
    if (hoveredEdge !== null) {
      alpha = isHovEdge ? Math.min(0.05 + norm*0.85, 1)*1.3 : (0.05+norm*0.85)*0.06;
      sw    = isHovEdge ? (0.3+norm*MAX_STR)*1.8 : 0.3+norm*MAX_STR;
    } else if (hoveredNode !== null) {
      const { li, ni } = hoveredNode;
      const conn = (li===e.fromLayer && ni===e.fromIdx) || (li===e.toLayer && ni===e.toIdx);
      alpha = conn ? Math.min(0.05+norm*0.85,1)*1.2 : (0.05+norm*0.85)*0.07;
      sw    = conn ? (0.3+norm*MAX_STR)*1.3 : 0.3+norm*MAX_STR;
    } else {
      alpha = 0.05 + norm*0.85;
      sw    = 0.3  + norm*MAX_STR;
    }

    ctx.beginPath();
    ctx.moveTo(e.x1, e.y1);
    ctx.lineTo(e.x2, e.y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth   = sw;
    ctx.stroke();
  });

  // Dessiner les neurones
  pos.forEach((layer, li) => {
    const R = Math.min(10, Math.max(4, (h/(layer.length+1))*0.27));
    layer.forEach((node, ni) => {
      const bias = li > 0 ? NN.biases[li-1][ni] : null;
      const isHov = hoveredNode && hoveredNode.li===li && hoveredNode.ni===ni;
      const fade  = (hoveredNode || hoveredEdge !== null) && !isHov;

      // Couleur du noeud selon biais
      let fill;
      if (bias === null) {
        fill = dark ? '#666' : '#bbb';
      } else if (Math.abs(bias) < 0.1) {
        fill = dark ? '#777' : '#aaa';
      } else {
        fill = bias > 0
          ? (dark ? '#85B7EB' : '#185FA5')
          : (dark ? '#F9CB42' : '#BA7517');
      }

      ctx.beginPath();
      ctx.arc(node.x, node.y, R+(isHov?3:0), 0, Math.PI*2);
      ctx.fillStyle   = fill;
      ctx.globalAlpha = fade ? 0.28 : 0.88;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';
      ctx.lineWidth   = isHov ? 2 : 0.5;
      ctx.stroke();

      // Biais textuel à l'intérieur si assez grand
      if (showBias && bias !== null && R >= 8) {
        ctx.font         = `${Math.max(8, R-1)}px system-ui,sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.85)';
        ctx.globalAlpha  = fade ? 0.22 : 0.75;
        ctx.fillText(bias.toFixed(2), node.x, node.y);
        ctx.globalAlpha  = 1;
      }

      // Label du neurone
      if (showLabels) {
        const label = layerName(li, ni);
        const lx    = li === 0 ? node.x - R - 5 : node.x + R + 5;
        ctx.font         = '11px system-ui,sans-serif';
        ctx.textAlign    = li === 0 ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(200,200,200,0.65)' : 'rgba(60,60,60,0.65)';
        ctx.globalAlpha  = fade ? 0.18 : 0.8;
        ctx.fillText(label, lx, node.y);
        ctx.globalAlpha  = 1;
      }
    });
  });

  // Labels de couche en bas
  const lnames = ['Entrées', ...Array.from({length:N_LAYER-2}, (_,i)=>`Cachée ${i+1}`), 'Sorties'];
  const lsizes = SIZES;
  ctx.font      = '11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = dark ? 'rgba(170,170,170,0.65)' : 'rgba(90,90,90,0.65)';
  ctx.globalAlpha = 1;
  const ly = h - 8;
  pos.forEach((layer, li) => {
    ctx.fillText(`${lnames[li]} (${lsizes[li]})`, layer[Math.floor(layer.length/2)].x, ly);
  });
}

// ── Hit tests ─────────────────────────────────────────────────────────────────

function hitNode(mx, my) {
  const { w, h } = getDims();
  const pos = getPositions(w, h);
  const R = 14;
  for (let li=0; li<pos.length; li++)
    for (let ni=0; ni<pos[li].length; ni++) {
      const n = pos[li][ni];
      if ((mx-n.x)**2 + (my-n.y)**2 <= R*R) return { li, ni };
    }
  return null;
}

function hitEdge(mx, my) {
  for (let i=edgeList.length-1; i>=0; i--) {
    const e = edgeList[i];
    const sw  = 0.3 + (Math.abs(e.w)/e.maxW)*MAX_STR;
    const hit = Math.max(5, sw*0.5+2);
    if (distToSegment(mx, my, e.x1, e.y1, e.x2, e.y2) <= hit) return i;
  }
  return null;
}

// ── Tooltip ───────────────────────────────────────────────────────────────────

function showTip(ev, html) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = '1';
  tooltip.style.left = (ev.clientX+14)+'px';
  tooltip.style.top  = (ev.clientY-10)+'px';
}

function hideTip() {
  tooltip.style.opacity = '0';
}

canvas.addEventListener('mousemove', ev => {
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const nh = hitNode(mx, my);

  if (nh) {
    hoveredNode = nh; hoveredEdge = null;
    canvas.style.cursor = 'pointer';
    const { li, ni } = nh;
    const name  = layerName(li, ni);
    const lname = li===0 ? 'Entrée' : li===N_LAYER-1 ? 'Sortie' : `Cachée ${li}`;
    let html = `<strong>${lname} — ${name}</strong><br>`;
    if (li > 0) {
      const b = NN.biases[li-1][ni];
      html += `Biais : ${b > 0 ? '+' : ''}${b.toFixed(5)}<br>`;
    }
    // Top 3 poids entrants (sauf couche d'entrée)
    if (li > 0) {
      const W = NN.weights[li-1];
      const top = W[ni].map((v,i) => ({v,i})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 entrants :<br>`;
      top.forEach(({v,i}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;${layerName(li-1,i)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    // Top 3 poids sortants (sauf couche de sortie)
    if (li < N_LAYER-1) {
      const W = NN.weights[li];
      const top = W.map((row,j) => ({v:row[ni],j})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 sortants :<br>`;
      top.forEach(({v,j}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;→ ${layerName(li+1,j)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    showTip(ev, html);
  } else {
    const eh = hitEdge(mx, my);
    if (eh !== null) {
      hoveredEdge = eh; hoveredNode = null;
      canvas.style.cursor = 'crosshair';
      const e = edgeList[eh];
      const c = e.w > 0 ? 'var(--pos)' : 'var(--neg)';
      showTip(ev,
        `<strong>${e.label}</strong><br>` +
        `Poids : <span style="color:${c};font-weight:500">${e.w>0?'+':''}${e.w.toFixed(6)}</span>`
      );
    } else {
      hoveredNode = null; hoveredEdge = null;
      canvas.style.cursor = 'default';
      hideTip();
    }
  }
  draw();
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null; hoveredEdge = null;
  hideTip(); draw();
});

// ── Contrôles ─────────────────────────────────────────────────────────────────

document.getElementById('threshold').addEventListener('input', function() {
  threshold = +this.value;
  document.getElementById('threshold-val').textContent = threshold + ' %';
  draw();
});
document.getElementById('show-bias').addEventListener('change',   function() { showBias   = this.checked; draw(); });
document.getElementById('show-labels').addEventListener('change', function() { showLabels = this.checked; draw(); });

window.addEventListener('resize', draw);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

draw();
</script>
</body>
