<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réseau de neurones — 8 × 16 × 5</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --bg2:       #f5f4f0;
    --text:      #1a1a1a;
    --text2:     #555;
    --border:    rgba(0,0,0,0.12);
    --border2:   rgba(0,0,0,0.22);
    --pos:       #185FA5;
    --neg:       #BA7517;
    --radius:    8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #1a1a1a;
      --bg2:     #252525;
      --text:    #e8e6de;
      --text2:   #999;
      --border:  rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.22);
      --pos:     #85B7EB;
      --neg:     #F9CB42;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px 20px 40px;
    min-height: 100vh;
  }

  header {
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
  }
  header p {
    font-size: 12px;
    color: var(--text2);
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text2);
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #controls input[type=range] {
    width: 130px;
    accent-color: var(--pos);
  }

  #canvas-wrap {
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }
  canvas {
    display: block;
    width: 100%;
    cursor: default;
  }

  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text2);
  }
  #legend span { display: flex; align-items: center; gap: 5px; }
  .l-line { width: 22px; height: 3px; border-radius: 2px; }
  .l-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    opacity: 0;
    background: var(--bg);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    transition: opacity 0.1s;
    z-index: 999;
    max-width: 220px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <h1>Réseau de neurones — 8 × 16 × 5</h1>
  <p>NN_1Layer_4_4U_real_v5_0_aux_grospoids.npz &nbsp;·&nbsp; 1 couche cachée &nbsp;·&nbsp; 8 entrées, 16 neurones cachés, 5 sorties</p>
</header>

<div id="controls">
  <label>
    Seuil de visibilité
    <input type="range" id="threshold" min="0" max="95" value="0" step="1">
    <span id="threshold-val">0 %</span>
  </label>
  <label><input type="checkbox" id="show-bias" checked> Biais</label>
  <label><input type="checkbox" id="show-labels" checked> Labels</label>
</div>

<div id="canvas-wrap">
  <canvas id="nn-canvas"></canvas>
</div>

<div id="legend">
  <span><span class="l-line" style="background:var(--pos)"></span> Poids positif</span>
  <span><span class="l-line" style="background:var(--neg)"></span> Poids négatif</span>
  <span><span class="l-dot" style="background:var(--pos)"></span> Biais &gt; 0</span>
  <span><span class="l-dot" style="background:var(--neg)"></span> Biais &lt; 0</span>
  <span><span class="l-dot" style="background:var(--text2);opacity:.5"></span> Biais ≈ 0</span>
</div>

<div id="tooltip"></div>

<script>
const NN = {"n_layers": 1, "sizes": [8, 16, 5], "weights": [[[0.07856036593049383, -17.156888709653874, 0.21989024360712095, -11.505589036492118, 0.29920516531132674, -16.582505620972714, -0.3736816704395077, -0.8407807576698328], [-0.466092398046242, 0.03874511196438017, -3.979961904932985, 0.13192208935270788, 0.019068859339289403, 0.02348856222385971, 4.413055916467246, 0.11467419486678954], [0.018231091483132417, -0.06059247399257201, -0.09923936498898585, -0.12085776772053797, -0.12591252754603244, -0.008149787822405564, -0.12018452316427436, 0.05703217719442224], [-0.5315340726444533, 0.25348226910914284, -2.293050554548793, 0.16131858598501977, 5.692529329335067, -0.10587028858896064, -3.0804398416098286, 0.2832684579240336], [-0.5441026913836748, 0.12226910594979529, 4.410754171251269, 0.11130730345892739, -4.318382467550275, 0.45495408726289843, 0.264005133360055, 0.21689267850197502], [3.915002469871166, -0.38939064121852357, -0.5101941495166411, 0.36428825221900357, -3.796029049541494, 3.9140596953753866, 0.13366038237635047, 0.21033279435257116], [-0.46286138137816135, -0.13075805036824742, 0.0805185614673538, 0.037959313428388514, -4.029251512609012, 0.38211798490787124, 4.356966481669801, -0.06346239477607435], [-0.20448717504919875, -0.18400687010389863, 0.6671663871387709, -35.29799609368947, -0.33541640011739676, -0.15618566482933352, -0.31577640642035204, -0.15824318764262602], [0.060278502483308884, -0.11089156488381033, -0.005517030273633484, 0.034077985285996516, -0.029604130863579124, -0.1252328420149445, -0.05752469399062895, -0.05306918432841084], [0.8322205785523819, -33.778954461820284, -0.2973830618351024, -0.16207413554277988, -0.44423436594995946, -0.12846443147003922, -0.3042939227760705, -0.16413229786756586], [-0.3437620841929741, 0.13295418261271977, 4.425004066476038, 0.26091605198317824, 0.04856477683254201, 0.15696231541081349, -4.16162156201015, 0.6214881378432929], [2.221155685438288, 1.5811662713585486, -0.5672249502135946, 0.42464577439181134, -1.033903320238469, -1.774675154141254, -0.99399185429661, 2.188228583957784], [-0.9371115312714072, 0.25450894895260895, 0.6471711131184156, 1.4807339985244503, 0.4811434990224413, 4.289993059139159, -0.08768358284008528, 4.552703340507823], [-0.20269330822587456, -0.16005257136256495, -0.2544147584013288, -0.13327319130538948, 0.6000298704153657, -30.26050330611578, -0.2458147864065551, -0.14755894657922322], [-0.1654501428884995, -0.1911160892308124, -0.24479586996558064, -0.1230657886491052, -0.2886896123773007, -0.17449190481330873, 0.5394153788541374, -35.73630042958713], [3.636447402173835, -0.3612916389331678, -1.208060830771304, 0.5038227576854202, 0.6494043840028941, 0.19213392888727007, -2.671525138377994, 1.5823971969856683]], [[-5.096797774287409, -0.25112648802405313, -0.01148055727510832, -0.5537529016044863, -0.5025901749352366, 2.194203380712375, -0.6896513391687268, 4.388974127356088, 0.1183117816736133, 0.0, -0.34390942668871943, 1.9753205450088451, 0.12520068611372462, 4.19391955100386, 3.5606295656171687, 2.275383869880335], [-3.086452223571756, -1.3532587966373981, 0.0697222017651951, -0.8097948952962186, 1.7955303122875481, -0.6030138709370799, -0.20490987082250706, 0.0, -0.0721932574575398, 4.450804895751717, 2.2641962676507514, 0.1470429732298682, 1.7005468949916176, 4.728489868986555, 4.162825667654774, -0.643459339280996], [-3.945678100564434, -0.13500011171839835, 0.12969512491039167, 2.4644709206867073, -1.0309343481872246, -0.6134846106013433, -1.1750283558429924, 4.532916054992269, 0.22613165587780698, 4.621908771837677, -0.28350992411708426, -0.07090646946452282, 2.0763116690672767, 0.0, 4.116122887945424, -0.64458775025986], [-0.1660745025919866, 1.6907350723863441, -0.025636398532539018, -0.7754854661761571, -0.2520315413868784, -0.6609878609782844, 1.8456588194776822, 4.276771690663189, -0.010072858649623102, 4.496653264655774, -1.29174594853886, 0.5721678535934236, 2.0466344290333347, 4.3767450386036995, 0.0, -0.8675456227765989], [12.63407555120273, 0.20181903929191808, -0.0474459840001608, -0.1846961470947269, 0.09078202311354651, -0.17192021317543665, 0.03145337117783672, 5.598385843856281, -0.022237854850231678, 4.560673044275033, -0.1677503428228506, -2.728807158770992, -5.8619831334675165, 4.325582844991914, 7.065759604624805, -0.27103740821017325]]], "biases": [[0.48800005737766466, 0.26989763380874343, 0.005679325122288285, 0.20656402623315614, 0.4428139561336331, 0.5214820078184212, 0.44129029730690833, 0.5633920952068779, -0.07232630259981318, 0.507600564684556, 0.1397047600189676, 1.736003325719526, 0.9692962094924727, 0.4739967771071226, 0.5608411357505624, 0.19118060518259203], [-1.2418528330320167, 0.8636425363108254, 1.759226633222708, -0.28626403873072703, -1.0947522977602369]]};

const canvas  = document.getElementById('nn-canvas');
const ctx     = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

const SIZES   = NN.sizes;        // [n_in, ...hidden..., n_out]
const N_LAYER = SIZES.length;    // nombre total de couches (entrée incluse)
const MAX_STR = 5;               // épaisseur max d'un trait en px

let hoveredNode = null;
let hoveredEdge = null;
let threshold   = 0;
let showBias    = true;
let showLabels  = true;
let edgeList    = [];

// ── Helpers ──────────────────────────────────────────────────────────────────

function isDark() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
  if (len2===0) return Math.hypot(px-x1, py-y1);
  const t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

// ── Layout ───────────────────────────────────────────────────────────────────

function getDims() {
  const maxN = Math.max(...SIZES);
  const w    = canvas.clientWidth || 900;
  const h    = Math.max(480, maxN * 28 + 100);
  return { w, h };
}

function setup() {
  const dpr = window.devicePixelRatio || 1;
  const { w, h } = getDims();
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  return { w, h };
}

function getPositions(w, h) {
  const margin = 0.08;
  return SIZES.map((n, li) => {
    const xFrac = N_LAYER === 1 ? 0.5 : margin + (li / (N_LAYER-1)) * (1 - 2*margin);
    const x     = w * xFrac;
    const spacing = h / (n + 1);
    return Array.from({length: n}, (_, i) => ({ x, y: spacing*(i+1) }));
  });
}

// ── Max absolute weight per layer transition ──────────────────────────────────

function getMaxWeights() {
  return NN.weights.map(W =>
    Math.max(...W.map(row => Math.max(...row.map(Math.abs))))
  );
}

// ── Edge list ─────────────────────────────────────────────────────────────────

function buildEdges(pos, maxW, thresholds) {
  const edges = [];
  NN.weights.forEach((W, wi) => {
    const fromLayer = pos[wi];
    const toLayer   = pos[wi+1];
    const nFrom = fromLayer.length, nTo = toLayer.length;
    const thresh = thresholds[wi];
    for (let j = 0; j < nTo; j++) {
      for (let i = 0; i < nFrom; i++) {
        const w = W[j][i];
        if (Math.abs(w) < thresh) continue;
        edges.push({
          x1: fromLayer[i].x, y1: fromLayer[i].y,
          x2: toLayer[j].x,   y2: toLayer[j].y,
          w, maxW: maxW[wi],
          fromLayer: wi, fromIdx: i,
          toLayer: wi+1, toIdx: j,
          label: `${layerName(wi, i)} → ${layerName(wi+1, j)}`
        });
      }
    }
  });
  return edges;
}

function layerName(li, ni) {
  if (li === 0)          return `x${ni+1}`;
  if (li === N_LAYER-1)  return `y${ni+1}`;
  return `h${li}.${ni+1}`;
}

// ── Draw ──────────────────────────────────────────────────────────────────────

function draw() {
  const { w, h } = setup();
  const pos     = getPositions(w, h);
  const maxW    = getMaxWeights();
  const thresh  = maxW.map(m => (threshold/100)*m);
  edgeList = buildEdges(pos, maxW, thresh);

  ctx.clearRect(0, 0, w, h);

  const dark   = isDark();
  const posRGB = hexToRgb(dark ? '#85B7EB' : '#185FA5');
  const negRGB = hexToRgb(dark ? '#F9CB42' : '#BA7517');

  // Dessiner les arêtes
  edgeList.forEach((e, idx) => {
    const absW  = Math.abs(e.w);
    const norm  = absW / e.maxW;
    const [r,g,b] = e.w > 0 ? posRGB : negRGB;
    const isHovEdge = hoveredEdge === idx;

    let alpha, sw;
    if (hoveredEdge !== null) {
      alpha = isHovEdge ? Math.min(0.05 + norm*0.85, 1)*1.3 : (0.05+norm*0.85)*0.06;
      sw    = isHovEdge ? (0.3+norm*MAX_STR)*1.8 : 0.3+norm*MAX_STR;
    } else if (hoveredNode !== null) {
      const { li, ni } = hoveredNode;
      const conn = (li===e.fromLayer && ni===e.fromIdx) || (li===e.toLayer && ni===e.toIdx);
      alpha = conn ? Math.min(0.05+norm*0.85,1)*1.2 : (0.05+norm*0.85)*0.07;
      sw    = conn ? (0.3+norm*MAX_STR)*1.3 : 0.3+norm*MAX_STR;
    } else {
      alpha = 0.05 + norm*0.85;
      sw    = 0.3  + norm*MAX_STR;
    }

    ctx.beginPath();
    ctx.moveTo(e.x1, e.y1);
    ctx.lineTo(e.x2, e.y2);
    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.lineWidth   = sw;
    ctx.stroke();
  });

  // Dessiner les neurones
  pos.forEach((layer, li) => {
    const R = Math.min(10, Math.max(4, (h/(layer.length+1))*0.27));
    layer.forEach((node, ni) => {
      const bias = li > 0 ? NN.biases[li-1][ni] : null;
      const isHov = hoveredNode && hoveredNode.li===li && hoveredNode.ni===ni;
      const fade  = (hoveredNode || hoveredEdge !== null) && !isHov;

      // Couleur du noeud selon biais
      let fill;
      if (bias === null) {
        fill = dark ? '#666' : '#bbb';
      } else if (Math.abs(bias) < 0.1) {
        fill = dark ? '#777' : '#aaa';
      } else {
        fill = bias > 0
          ? (dark ? '#85B7EB' : '#185FA5')
          : (dark ? '#F9CB42' : '#BA7517');
      }

      ctx.beginPath();
      ctx.arc(node.x, node.y, R+(isHov?3:0), 0, Math.PI*2);
      ctx.fillStyle   = fill;
      ctx.globalAlpha = fade ? 0.28 : 0.88;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';
      ctx.lineWidth   = isHov ? 2 : 0.5;
      ctx.stroke();

      // Biais textuel à l'intérieur si assez grand
      if (showBias && bias !== null && R >= 8) {
        ctx.font         = `${Math.max(8, R-1)}px system-ui,sans-serif`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.85)';
        ctx.globalAlpha  = fade ? 0.22 : 0.75;
        ctx.fillText(bias.toFixed(2), node.x, node.y);
        ctx.globalAlpha  = 1;
      }

      // Label du neurone
      if (showLabels) {
        const label = layerName(li, ni);
        const lx    = li === 0 ? node.x - R - 5 : node.x + R + 5;
        ctx.font         = '11px system-ui,sans-serif';
        ctx.textAlign    = li === 0 ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = dark ? 'rgba(200,200,200,0.65)' : 'rgba(60,60,60,0.65)';
        ctx.globalAlpha  = fade ? 0.18 : 0.8;
        ctx.fillText(label, lx, node.y);
        ctx.globalAlpha  = 1;
      }
    });
  });

  // Labels de couche en bas
  const lnames = ['Entrées', ...Array.from({length:N_LAYER-2}, (_,i)=>`Cachée ${i+1}`), 'Sorties'];
  const lsizes = SIZES;
  ctx.font      = '11px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = dark ? 'rgba(170,170,170,0.65)' : 'rgba(90,90,90,0.65)';
  ctx.globalAlpha = 1;
  const ly = h - 8;
  pos.forEach((layer, li) => {
    ctx.fillText(`${lnames[li]} (${lsizes[li]})`, layer[Math.floor(layer.length/2)].x, ly);
  });
}

// ── Hit tests ─────────────────────────────────────────────────────────────────

function hitNode(mx, my) {
  const { w, h } = getDims();
  const pos = getPositions(w, h);
  const R = 14;
  for (let li=0; li<pos.length; li++)
    for (let ni=0; ni<pos[li].length; ni++) {
      const n = pos[li][ni];
      if ((mx-n.x)**2 + (my-n.y)**2 <= R*R) return { li, ni };
    }
  return null;
}

function hitEdge(mx, my) {
  for (let i=edgeList.length-1; i>=0; i--) {
    const e = edgeList[i];
    const sw  = 0.3 + (Math.abs(e.w)/e.maxW)*MAX_STR;
    const hit = Math.max(5, sw*0.5+2);
    if (distToSegment(mx, my, e.x1, e.y1, e.x2, e.y2) <= hit) return i;
  }
  return null;
}

// ── Tooltip ───────────────────────────────────────────────────────────────────

function showTip(ev, html) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = '1';
  tooltip.style.left = (ev.clientX+14)+'px';
  tooltip.style.top  = (ev.clientY-10)+'px';
}

function hideTip() {
  tooltip.style.opacity = '0';
}

canvas.addEventListener('mousemove', ev => {
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const nh = hitNode(mx, my);

  if (nh) {
    hoveredNode = nh; hoveredEdge = null;
    canvas.style.cursor = 'pointer';
    const { li, ni } = nh;
    const name  = layerName(li, ni);
    const lname = li===0 ? 'Entrée' : li===N_LAYER-1 ? 'Sortie' : `Cachée ${li}`;
    let html = `<strong>${lname} — ${name}</strong><br>`;
    if (li > 0) {
      const b = NN.biases[li-1][ni];
      html += `Biais : ${b > 0 ? '+' : ''}${b.toFixed(5)}<br>`;
    }
    // Top 3 poids entrants (sauf couche d'entrée)
    if (li > 0) {
      const W = NN.weights[li-1];
      const top = W[ni].map((v,i) => ({v,i})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 entrants :<br>`;
      top.forEach(({v,i}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;${layerName(li-1,i)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    // Top 3 poids sortants (sauf couche de sortie)
    if (li < N_LAYER-1) {
      const W = NN.weights[li];
      const top = W.map((row,j) => ({v:row[ni],j})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
      html += `Top 3 sortants :<br>`;
      top.forEach(({v,j}) => {
        const c = v > 0 ? 'var(--pos)' : 'var(--neg)';
        html += `&nbsp;→ ${layerName(li+1,j)} : <span style="color:${c};font-weight:500">${v>0?'+':''}${v.toFixed(4)}</span><br>`;
      });
    }
    showTip(ev, html);
  } else {
    const eh = hitEdge(mx, my);
    if (eh !== null) {
      hoveredEdge = eh; hoveredNode = null;
      canvas.style.cursor = 'crosshair';
      const e = edgeList[eh];
      const c = e.w > 0 ? 'var(--pos)' : 'var(--neg)';
      showTip(ev,
        `<strong>${e.label}</strong><br>` +
        `Poids : <span style="color:${c};font-weight:500">${e.w>0?'+':''}${e.w.toFixed(6)}</span>`
      );
    } else {
      hoveredNode = null; hoveredEdge = null;
      canvas.style.cursor = 'default';
      hideTip();
    }
  }
  draw();
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null; hoveredEdge = null;
  hideTip(); draw();
});

// ── Contrôles ─────────────────────────────────────────────────────────────────

document.getElementById('threshold').addEventListener('input', function() {
  threshold = +this.value;
  document.getElementById('threshold-val').textContent = threshold + ' %';
  draw();
});
document.getElementById('show-bias').addEventListener('change',   function() { showBias   = this.checked; draw(); });
document.getElementById('show-labels').addEventListener('change', function() { showLabels = this.checked; draw(); });

window.addEventListener('resize', draw);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

draw();
</script>
</body>
</html>
